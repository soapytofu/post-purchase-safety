name: Quality gates
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      AUTH_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: touch prisma/ci.db && npm run db:push
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: safekeep_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/safekeep_test
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/safekeep_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: psql "$DATABASE_URL" -c 'CREATE ROLE anon; CREATE ROLE authenticated; GRANT USAGE ON SCHEMA public TO anon, authenticated;'
      - run: npm run db:hosted:generate
      - run: npm run db:hosted:deploy
      - run: node --import tsx --test tests/household-isolation.test.ts
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/hosted/schema.prisma --exit-code
      - run: npm run build:hosted
